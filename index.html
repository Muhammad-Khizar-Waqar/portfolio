<!doctype html>
<html lang='en' data-bs-theme='dark' class="khizar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Khizar Waqar</title>
  </head>
  <body>
    <!--
      Netlify registers forms by parsing the built HTML at deploy time. This app
      is client-rendered, so the real form in components/sections/Contact.jsx is
      never present in dist/index.html and would go undetected. This hidden copy
      is what registers the "contact" form; the React form posts back to it.
      Field names must stay in sync with EMPTY_FORM in Contact.jsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
